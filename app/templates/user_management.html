<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - DeepSOC Admin</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/admin_dark.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <div class="admin-wrapper">
        {% set active_page = 'users' %}
        {% include 'includes/admin_sidebar.html' %}
        
        <main class="admin-content">
            <header class="admin-header">
                <div class="d-flex justify-content-between align-items-center w-100">
                    <h4 class="m-0">用户与权限管理</h4>
                    <button class="btn btn-primary" id="create-user-btn">
                        <i class="bi bi-person-plus me-1"></i>创建用户
                    </button>
                </div>
            </header>
            
            <div class="admin-main">
                <div class="card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0" id="user-table">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>用户名</th>
                                        <th>昵称</th>
                                        <th>邮箱</th>
                                        <th>手机号</th>
                                        <th>角色</th>
                                        <th>状态</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal fade" id="user-modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">用户信息</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="user-id">
                    <div class="row mb-3 align-items-center">
                        <label class="col-sm-3 col-form-label">用户名</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control" id="user-username" required>
                        </div>
                    </div>
                    <div class="row mb-3 align-items-center">
                        <label class="col-sm-3 col-form-label">昵称</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control" id="user-nickname">
                        </div>
                    </div>
                    <div class="row mb-3 align-items-center">
                        <label class="col-sm-3 col-form-label">邮箱</label>
                        <div class="col-sm-9">
                            <input type="email" class="form-control" id="user-email" required>
                        </div>
                    </div>
                    <div class="row mb-3 align-items-center">
                        <label class="col-sm-3 col-form-label">手机号</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control" id="user-phone">
                        </div>
                    </div>
                    <div class="row mb-3 align-items-center">
                        <label class="col-sm-3 col-form-label">角色</label>
                        <div class="col-sm-9">
                            <select class="form-select" id="user-role">
                                <option value="user">用户</option>
                                <option value="admin">管理员</option>
                                <option value="auditor">审计员</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mb-3 align-items-center">
                        <label class="col-sm-3 col-form-label">密码 <small class="text-muted">(创建时必填)</small></label>
                        <div class="col-sm-9">
                            <input type="password" class="form-control" id="user-password">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" id="save-user-btn">保存</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/user_management.js"></script>
</body>
</html>
