<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提示词管理 - DeepSOC Admin</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/admin_dark.css">
    <link rel="stylesheet" href="/static/css/theme_light.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .prompt-section textarea {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', 'source-code-pro', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
        }
    </style>
</head>
<body class="dark-theme">
    <div class="admin-wrapper">
        {% set active_page = 'prompts' %}
        {% include 'includes/admin_sidebar.html' %}
        
        <main class="admin-content">
            <header class="admin-header">
                <h4 class="m-0">AI Agent 提示词管理</h4>
            </header>
            
            <div class="admin-main">
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <div class="card h-100">
                            <div class="card-header">
                                <h6 class="mb-0">Agent 角色</h6>
                            </div>
                            <div class="list-group list-group-flush" id="prompt-nav">
                                <a class="list-group-item list-group-item-action active" data-target="_captain" href="#_captain">
                                    <i class="bi bi-person-badge me-2"></i>指挥官 (Captain)
                                </a>
                                <a class="list-group-item list-group-item-action" data-target="_manager" href="#_manager">
                                    <i class="bi bi-diagram-3 me-2"></i>安全经理 (Manager)
                                </a>
                                <a class="list-group-item list-group-item-action" data-target="_operator" href="#_operator">
                                    <i class="bi bi-terminal me-2"></i>操作员 (Operator)
                                </a>
                                <a class="list-group-item list-group-item-action" data-target="_expert" href="#_expert">
                                    <i class="bi bi-award me-2"></i>安全专家 (Expert)
                                </a>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-9" id="prompt-container">
                        <div class="card h-100 prompt-section" data-role="_captain">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <div>
                                    <h5 class="mb-0">指挥官提示词</h5>
                                    <small class="text-muted">负责全局决策与指挥</small>
                                </div>
                                <button class="btn btn-primary save-prompt-btn" data-role="_captain">
                                    <i class="bi bi-save me-1"></i>保存修改
                                </button>
                            </div>
                            <div class="card-body p-0">
                                <textarea class="form-control border-0 h-100 p-3" rows="20" id="prompt-_captain" style="min-height: 500px; resize: none;"></textarea>
                            </div>
                        </div>
                        
                        <div class="card h-100 prompt-section d-none" data-role="_manager">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <div>
                                    <h5 class="mb-0">安全经理提示词</h5>
                                    <small class="text-muted">负责任务拆解与分发</small>
                                </div>
                                <button class="btn btn-primary save-prompt-btn" data-role="_manager">
                                    <i class="bi bi-save me-1"></i>保存修改
                                </button>
                            </div>
                            <div class="card-body p-0">
                                <textarea class="form-control border-0 h-100 p-3" rows="20" id="prompt-_manager" style="min-height: 500px; resize: none;"></textarea>
                            </div>
                        </div>
                        
                        <div class="card h-100 prompt-section d-none" data-role="_operator">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <div>
                                    <h5 class="mb-0">操作员提示词</h5>
                                    <small class="text-muted">负责具体工具执行</small>
                                </div>
                                <button class="btn btn-primary save-prompt-btn" data-role="_operator">
                                    <i class="bi bi-save me-1"></i>保存修改
                                </button>
                            </div>
                            <div class="card-body p-0">
                                <textarea class="form-control border-0 h-100 p-3" rows="20" id="prompt-_operator" style="min-height: 500px; resize: none;"></textarea>
                            </div>
                        </div>
                        
                        <div class="card h-100 prompt-section d-none" data-role="_expert">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <div>
                                    <h5 class="mb-0">安全专家提示词</h5>
                                    <small class="text-muted">负责提供专业建议与知识</small>
                                </div>
                                <button class="btn btn-primary save-prompt-btn" data-role="_expert">
                                    <i class="bi bi-save me-1"></i>保存修改
                                </button>
                            </div>
                            <div class="card-body p-0">
                                <textarea class="form-control border-0 h-100 p-3" rows="20" id="prompt-_expert" style="min-height: 500px; resize: none;"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/theme-switcher.js"></script>
    <script src="/static/js/prompt_management.js"></script>
</body>
</html>
