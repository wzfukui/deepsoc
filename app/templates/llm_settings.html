<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型设置 - DeepSOC Admin</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/admin_dark.css">
    <link rel="stylesheet" href="/static/css/theme_light.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <div class="admin-wrapper">
        {% set active_page = 'llm' %}
        {% include 'includes/admin_sidebar.html' %}
        
        <main class="admin-content">
            <header class="admin-header">
                <h4 class="m-0">大模型参数配置</h4>
            </header>
            
            <div class="admin-main">
                <div class="row">
                    <!-- 推理模型配置 -->
                    <div class="col-md-6">
                        <div class="card mb-4 h-100">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <div>
                                    <h5 class="mb-0"><i class="bi bi-robot me-2"></i>推理模型 (Reasoning)</h5>
                                    <small class="text-muted">用于安全事件分析与决策</small>
                                </div>
                                <span class="badge bg-primary">Core</span>
                            </div>
                            <div class="card-body">
                                <form id="reasoning-form">
                                    <input type="hidden" name="config_type" value="reasoning">
                                    <div class="mb-3">
                                        <label class="form-label">API Base URL</label>
                                        <input type="text" class="form-control" name="api_base" placeholder="https://api.openai.com/v1">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">API Key</label>
                                        <div class="input-group">
                                            <input type="password" class="form-control" name="api_key" placeholder="sk-...">
                                            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword(this)">
                                                <i class="bi bi-eye"></i>
                                            </button>
                                        </div>
                                        <div class="form-text">留空则不修改。如果未配置，将使用系统环境变量。</div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Model Name</label>
                                        <input type="text" class="form-control" name="model_name" placeholder="gpt-4o-mini">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Temperature</label>
                                        <input type="number" step="0.1" min="0" max="2" class="form-control" name="temperature" value="0.7">
                                    </div>
                                    <div class="form-check mb-3">
                                        <input class="form-check-input" type="checkbox" name="is_active" checked>
                                        <label class="form-check-label">启用此配置</label>
                                    </div>
                                    <div class="d-flex justify-content-between mt-4">
                                        <button type="button" class="btn btn-outline-light" onclick="testConnection('reasoning')">测试连接</button>
                                        <button type="submit" class="btn btn-primary px-4">保存配置</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- 总结模型配置 -->
                    <div class="col-md-6">
                        <div class="card mb-4 h-100">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <div>
                                    <h5 class="mb-0"><i class="bi bi-file-text me-2"></i>总结模型 (Summary)</h5>
                                    <small class="text-muted">用于长文本归纳与总结</small>
                                </div>
                                <span class="badge bg-info text-dark">Helper</span>
                            </div>
                            <div class="card-body">
                                <form id="summary-form">
                                    <input type="hidden" name="config_type" value="summary">
                                    <div class="mb-3">
                                        <label class="form-label">API Base URL</label>
                                        <input type="text" class="form-control" name="api_base" placeholder="https://api.openai.com/v1">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">API Key</label>
                                        <div class="input-group">
                                            <input type="password" class="form-control" name="api_key" placeholder="sk-...">
                                            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword(this)">
                                                <i class="bi bi-eye"></i>
                                            </button>
                                        </div>
                                        <div class="form-text">留空则不修改。</div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Model Name</label>
                                        <input type="text" class="form-control" name="model_name" placeholder="qwen-long">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Temperature</label>
                                        <input type="number" step="0.1" min="0" max="2" class="form-control" name="temperature" value="0.5">
                                    </div>
                                    <div class="form-check mb-3">
                                        <input class="form-check-input" type="checkbox" name="is_active" checked>
                                        <label class="form-check-label">启用此配置</label>
                                    </div>
                                    <div class="d-flex justify-content-between mt-4">
                                        <button type="button" class="btn btn-outline-light" onclick="testConnection('summary')">测试连接</button>
                                        <button type="submit" class="btn btn-primary px-4">保存配置</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast容器 -->
    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/theme-switcher.js"></script>
    <script>
        // 内联JS处理配置加载和保存 (保留原有逻辑，适配新UI)
        document.addEventListener('DOMContentLoaded', function() {
            loadConfigs();
            
            document.getElementById('reasoning-form').addEventListener('submit', (e) => saveConfig(e, 'reasoning'));
            document.getElementById('summary-form').addEventListener('submit', (e) => saveConfig(e, 'summary'));
        });

        async function loadConfigs() {
            try {
                const token = getCookie('access_token');
                const response = await fetch('/api/llm-config/', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    if (data.data.reasoning) fillForm('reasoning', data.data.reasoning);
                    if (data.data.summary) fillForm('summary', data.data.summary);
                }
            } catch (error) {
                console.error('加载配置失败', error);
            }
        }

        function fillForm(type, data) {
            const form = document.getElementById(type + '-form');
            if(data.api_base) form.querySelector('[name="api_base"]').value = data.api_base;
            if(data.model_name) form.querySelector('[name="model_name"]').value = data.model_name;
            if(data.temperature) form.querySelector('[name="temperature"]').value = data.temperature;
            form.querySelector('[name="is_active"]').checked = data.is_active;
            const keyInput = form.querySelector('[name="api_key"]');
            if (data.has_api_key) {
                keyInput.placeholder = "已配置 (输入新值以覆盖)";
            }
        }

        async function saveConfig(e, type) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const payload = {
                config_type: type,
                api_base: formData.get('api_base'),
                model_name: formData.get('model_name'),
                temperature: formData.get('temperature'),
                is_active: formData.get('is_active') === 'on',
                api_key: formData.get('api_key') || null
            };

            try {
                const token = getCookie('access_token');
                const response = await fetch('/api/llm-config/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.status === 'success') {
                    showToast('保存成功', 'success');
                    if (result.data.has_api_key) {
                         form.querySelector('[name="api_key"]').value = '';
                         form.querySelector('[name="api_key"]').placeholder = "已配置 (输入新值以覆盖)";
                    }
                } else {
                    showToast('保存失败: ' + result.message, 'danger');
                }
            } catch (error) {
                showToast('保存失败: ' + error.message, 'danger');
            }
        }

        async function testConnection(type) {
            const form = document.getElementById(type + '-form');
            const formData = new FormData(form);
            const payload = {
                config_type: type,
                api_base: formData.get('api_base'),
                model_name: formData.get('model_name'),
                api_key: formData.get('api_key')
            };
            const btn = form.querySelector('button[onclick*="testConnection"]');
            const originalText = btn.textContent;
            btn.textContent = '测试中...';
            btn.disabled = true;

            try {
                const token = getCookie('access_token');
                const response = await fetch('/api/llm-config/test', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.status === 'success') {
                    showToast('连接成功! 响应: ' + result.response, 'success');
                } else {
                    showToast('连接失败: ' + result.message, 'danger');
                }
            } catch (error) {
                showToast('连接失败: ' + error.message, 'danger');
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        function togglePassword(btn) {
            const input = btn.previousElementSibling;
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = '<i class="bi bi-eye-slash"></i>';
            } else {
                input.type = 'password';
                btn.innerHTML = '<i class="bi bi-eye"></i>';
            }
        }

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        function showToast(message, type = 'info') {
            const toastContainer = document.getElementById('toast-container');
            const toastEl = document.createElement('div');
            toastEl.className = `toast align-items-center text-white bg-${type} border-0`;
            toastEl.setAttribute('role', 'alert');
            toastEl.setAttribute('aria-live', 'assertive');
            toastEl.setAttribute('aria-atomic', 'true');
            toastEl.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">${message}</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>`;
            toastContainer.appendChild(toastEl);
            const toast = new bootstrap.Toast(toastEl);
            toast.show();
            toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
        }
    </script>
</body>
</html>
