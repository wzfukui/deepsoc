<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - DeepSOC</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/admin_dark.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Force high contrast for Login Page explicitly */
        .login-page {
            background-color: #000 !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            background-color: #111 !important;
            border: 1px solid #333 !important;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6) !important;
        }
        .login-card .card-header {
            background-color: transparent;
            border-bottom: 1px solid #333 !important;
        }
        .login-title, h4, label {
            color: #ededed !important;
        }
        .form-control {
            background-color: #000 !important;
            border: 1px solid #333 !important;
            color: #fff !important;
        }
        .form-control::placeholder {
            color: #666 !important;
        }
        .form-control:focus {
            background-color: #000 !important;
            border-color: #fff !important;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.2) !important;
            color: #fff !important;
        }
        .input-group-text {
            background-color: #222 !important;
            border-color: #333 !important;
            color: #888 !important;
        }
        .btn-primary {
            background-color: #ededed !important;
            color: #000 !important;
            border: none !important;
            font-weight: 600;
        }
        .btn-primary:hover {
            background-color: #fff !important;
            color: #000 !important;
            transform: translateY(-1px);
        }
        .brand-logo {
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.1));
        }
    </style>
</head>
<body class="dark-theme login-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="brand-container d-flex align-items-center justify-content-center mb-4">
                    <img src="/static/images/logo/logo.png" alt="DeepSOC Logo" class="brand-logo logo-img me-3" style="max-width: 64px;">
                    <div class="brand-text">
                        <h1 class="login-title mb-0 fw-bold" style="font-size: 2rem;">DeepSOC</h1>
                        <p class="mb-0 small text-muted">AI Security Operations</p>
                    </div>
                </div>
                
                <div class="card login-card">
                    <div class="card-body p-4">
                        <h4 class="mb-4 text-center fw-bold">Login</h4>
                        <div id="login-error" class="alert alert-danger d-none" role="alert"></div>
                        
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="username" class="form-label small text-uppercase fw-bold text-muted">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="username" required placeholder="admin">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label small text-uppercase fw-bold text-muted">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-key"></i></span>
                                    <input type="password" class="form-control" id="password" required placeholder="••••••••">
                                </div>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary py-2">
                                    Sign In
                                </button>
                            </div>
                        </form>
                        
                        <div class="text-center mt-4">
                            <small class="text-secondary">Restricted System</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast容器 -->
    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/login.js"></script>
</body>
</html>
