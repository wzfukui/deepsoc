<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全背景 - DeepSOC Admin</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/admin_dark.css">
    <link rel="stylesheet" href="/static/css/theme_light.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        #background-text {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', 'source-code-pro', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
        }
    </style>
</head>
<body class="dark-theme">
    <div class="admin-wrapper">
        {% set active_page = 'background' %}
        {% include 'includes/admin_sidebar.html' %}
        
        <main class="admin-content">
            <header class="admin-header">
                <h4 class="m-0">安全背景知识库</h4>
            </header>
            
            <div class="admin-main">
                <div class="card h-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-0">背景知识内容</h5>
                            <small class="text-muted">定义组织特定的安全环境、资产列表和安全策略</small>
                        </div>
                        <button class="btn btn-primary" id="save-btn">
                            <i class="bi bi-save me-1"></i>保存修改
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <textarea class="form-control border-0 h-100 p-3" rows="20" id="background-text" style="min-height: 500px; resize: none;"></textarea>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/theme-switcher.js"></script>
    <script src="/static/js/background_editor.js"></script>
    <script>const BACKGROUND_NAME = 'background_security';</script>
</body>
</html>
